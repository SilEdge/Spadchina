<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Место — Спадчына</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;600&family=JetBrains+Mono:wght@600&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<div class="cover" style="min-height:460px"><img id="im" alt=""><div class="wrap"><p id="mt" style="font:600 13px 'JetBrains Mono';text-transform:uppercase"></p><h1 id="nm" style="font-size:clamp(34px,6vw,72px)"></h1></div></div>
<section><div class="wrap art"><div><p id="ld" style="font-size:21px"></p><div id="qz" class="q"></div></div><aside><p class="meta">Прогресс теста</p><div class="bar" style="margin:10px 0 20px"><i id="pb" style="width:0"></i></div><p class="meta">Баллы: <b id="sc">0</b></p><a class="btn o" href="catalog.html" style="margin-top:20px">← Все места</a></aside></div></section>
<script src="data.js"></script><script src="app.js"></script>
<script>const p=D.places.find(x=>x.id===new URLSearchParams(location.search).get("id"))||D.places[0],Q=D.quizzes[p.id]||[];document.title=p.name+" — Спадчына";
im.src=p.image;nm.textContent=p.name;mt.textContent=cat(p.cat).name+" · "+p.region+" · "+p.era;ld.textContent=p.lead;let i=0,score=0;
function show(){pb.style.width=(i/Q.length*100)+"%";sc.textContent=score;if(i>=Q.length){qz.innerHTML=`<h3>Готово! ${score} баллов</h3><button class="btn" onclick="i=0;score=0;show()">Пройти снова</button>`;return}
const q=Q[i];qz.innerHTML=`<p class="meta">Вопрос ${i+1} из ${Q.length}</p><h3>${q.q}</h3><div class="ans">${q.a.map((a,k)=>`<button data-k="${k}">${a}</button>`).join("")}</div><p id="ex" style="margin-top:16px"></p>`;
qz.querySelectorAll(".ans button").forEach(b=>b.onclick=()=>{if(qz.dataset.done)return;qz.dataset.done=1;const k=+b.dataset.k;qz.querySelectorAll(".ans button")[q.ok].classList.add("ok");if(k!==q.ok)b.classList.add("bad");else score+=Math.round(p.pts/Q.length);
ex.innerHTML=q.explanation+`<br><br><button class="btn">${i+1<Q.length?"Дальше":"Результат"}</button>`;ex.querySelector("button").onclick=()=>{delete qz.dataset.done;i++;show()}})}
if(Q.length)show();else qz.remove();</script></body></html>
