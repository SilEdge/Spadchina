services:
  - type: web
    name: spadchina-backend
    runtime: go
    plan: starter
    rootDir: backend
    buildCommand: go build -o spadchina-backend .
    startCommand: ./spadchina-backend
    healthCheckPath: /api/health
    disk:
      name: spadchina-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/spadchina.db
      - key: TELEGRAM_SUPPORT_CHAT_ID
        value: "5558125185"
      - key: TELEGRAM_IDEAS_CHAT_ID
        value: "5558125185"
      - key: TELEGRAM_CHAT_ID
        value: "5558125185"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_IDEAS_BOT_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
